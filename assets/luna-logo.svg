<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">LUNA AI mission patch</title>
  <defs>
    <radialGradient id="space" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#16306e"/>
      <stop offset=".55" stop-color="#0a1638"/>
      <stop offset="1" stop-color="#040818"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset=".6" stop-color="#c9d3e8"/>
      <stop offset="1" stop-color="#7e8aa8"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeb8cf"/>
      <stop offset="1" stop-color="#3b4460"/>
    </linearGradient>
    <radialGradient id="earth" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".6" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1f5c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="192"/></clipPath>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="244" cy="214" r="104" fill="#fff"/>
      <circle cx="292" cy="190" r="92" fill="#000"/>
    </mask>
    <path id="arcTop" d="M 50 256 A 206 206 0 0 1 462 256"/>
    <path id="arcBot" d="M 40 256 A 216 216 0 0 0 472 256"/>
  </defs>

  <!-- outer patch ring -->
  <circle cx="256" cy="256" r="250" fill="#060c22"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g font-family="Orbitron, 'Arial Black', Arial, sans-serif" font-weight="800" fill="#e6f1ff" text-anchor="middle">
    <text font-size="31" letter-spacing="5"><textPath href="#arcTop" startOffset="50%">LUNA · LUNAR HABITAT AI</textPath></text>
    <text font-size="20" letter-spacing="6" fill="#93a4c8"><textPath href="#arcBot" startOffset="50%">HUNCH · PROJECT ARES · SELENE LINK</textPath></text>
  </g>
  <g fill="#38bdf8"><circle cx="34" cy="256" r="5"/><circle cx="478" cy="256" r="5"/></g>

  <!-- inner scene -->
  <g clip-path="url(#disc)">
    <rect width="512" height="512" fill="url(#space)"/>
    <g fill="#fff">
      <circle cx="120" cy="140" r="1.6"/><circle cx="170" cy="92" r="1.2"/><circle cx="330" cy="104" r="1.4"/>
      <circle cx="392" cy="176" r="1.1"/><circle cx="104" cy="230" r="1.3"/><circle cx="410" cy="250" r="1.5"/>
      <circle cx="214" cy="330" r="1"/><circle cx="148" cy="300" r="1.2"/><circle cx="370" cy="306" r="1"/>
      <circle cx="270" cy="84" r="1"/><circle cx="96" cy="182" r="1"/>
    </g>
    <!-- Earth rising -->
    <circle cx="378" cy="128" r="30" fill="url(#earth)"/>
    <path d="M360 118c8-6 18-3 22 4s-2 12-9 11-14 2-16-4 1-9 3-11z M384 142c6-2 12 2 10 7s-8 6-12 3z" fill="#34d399" opacity=".85"/>
    <circle cx="390" cy="122" r="34" fill="#040818" opacity=".55"/>

    <!-- orbit with LUNA + SELENE sparks -->
    <ellipse cx="256" cy="226" rx="168" ry="54" fill="none" stroke="#38bdf8" stroke-opacity=".55" stroke-width="2.5" transform="rotate(-14 256 226)"/>

    <!-- crescent moon with neural constellation -->
    <rect width="512" height="512" fill="url(#moon)" mask="url(#crescent)"/>
    <g mask="url(#crescent)" fill="#5c6a8c" opacity=".45">
      <circle cx="176" cy="196" r="10"/><circle cx="200" cy="268" r="7"/><circle cx="160" cy="236" r="5"/>
    </g>
    <g stroke="#38bdf8" stroke-width="2.4" fill="none" filter="url(#glow)" opacity=".95">
      <path d="M168 168 L198 214 L176 250 L214 286 M198 214 L232 196 M176 250 L150 222"/>
    </g>
    <g fill="#e0f2fe" filter="url(#glow)">
      <circle cx="168" cy="168" r="5.5"/><circle cx="198" cy="214" r="6.5"/><circle cx="176" cy="250" r="5.5"/>
      <circle cx="214" cy="286" r="5"/><circle cx="232" cy="196" r="4.5"/><circle cx="150" cy="222" r="4"/>
    </g>
    <!-- orbit front arc over the crescent -->
    <path d="M 98 282 A 168 54 -14 0 0 420 184" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(0)" opacity=".9"/>
    <circle cx="410" cy="178" r="7" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="112" cy="282" r="7" fill="#f472b6" filter="url(#glow)"/>

    <!-- lunar surface + habitat -->
    <path d="M40 392 Q 256 318 472 392 L472 512 L40 512 Z" fill="url(#ground)"/>
    <ellipse cx="150" cy="404" rx="22" ry="5" fill="#2b3350" opacity=".6"/>
    <ellipse cx="372" cy="398" rx="16" ry="4" fill="#2b3350" opacity=".6"/>
    <g>
      <rect x="176" y="350" width="44" height="18" rx="7" fill="#dbe3f5"/>
      <rect x="292" y="350" width="44" height="18" rx="7" fill="#dbe3f5"/>
      <path d="M212 368 A 44 44 0 0 1 300 368 Z" fill="#eef3ff"/>
      <path d="M222 368 A 34 34 0 0 1 290 368" fill="none" stroke="#9aa6bd" stroke-width="2"/>
      <rect x="200" y="366" width="112" height="6" rx="3" fill="#8590ab"/>
      <g fill="#38bdf8" filter="url(#glow)">
        <rect x="244" y="342" width="24" height="8" rx="3"/>
        <circle cx="188" cy="359" r="3"/><circle cx="204" cy="359" r="3"/>
        <circle cx="308" cy="359" r="3"/><circle cx="324" cy="359" r="3"/>
      </g>
      <path d="M256 324 V 306" stroke="#dbe3f5" stroke-width="3"/>
      <circle cx="256" cy="302" r="5" fill="#f472b6" filter="url(#glow)"/>
      <!-- heartbeat: the SELENE link -->
      <path d="M150 384 H222 L232 372 L242 396 L252 380 L258 384 H362" fill="none" stroke="#f472b6" stroke-width="2.6" stroke-linejoin="round" filter="url(#glow)"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#0b1430" stroke-width="2"/>
</svg>
